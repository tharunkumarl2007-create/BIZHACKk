  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-['Plus_Jakarta_Sans',sans-serif]">
    <div id="file-protocol-warning" style="display:none; padding: 24px; font-family: sans-serif; text-align: center; max-width: 550px; margin: 60px auto; border: 2px solid #6366f1; border-radius: 16px; background: white; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
      <h2 style="color: #1e1b4b; margin-bottom: 8px;">WARRANTY+ Web Server Active</h2>
      <p style="color: #475569; font-size: 14px; margin-bottom: 20px;">
        Modern React + TypeScript applications must be opened through the local web server rather than directly via <code>file:///</code>.
      </p>
      <a href="http://localhost:5173" style="display: inline-block; background: #4f46e5; color: white; padding: 12px 24px; border-radius: 10px; font-weight: bold; text-decoration: none; font-size: 14px;">

        Or double-click <strong>RUN_APP.bat</strong> in the BIZHACK folder.
      </p>
    </div>
    <script>
      if (window.location.protocol === 'file:') {
        document.getElementById('file-protocol-warning').style.display = 'block';
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
